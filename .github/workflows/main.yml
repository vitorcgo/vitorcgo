name: Atualizar contribuições

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - README.md
      - .github/workflows/main.yml
      - .github/scripts/ascii_contributions.py

concurrency:
  group: profile-contributions
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'vitorcgo/vitorcgo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Obter os arquivos do perfil
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Desenhar as contribuições em ASCII
        run: python3 .github/scripts/ascii_contributions.py ${{ github.repository_owner }} src/ascii/contributions.svg

      - name: Publicar o gráfico atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ascii/contributions.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: atualizar gráficos de contribuições"
          git pull --rebase
          git push
