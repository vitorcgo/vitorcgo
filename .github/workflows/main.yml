name: Atualizar Pac-Man

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - README.md
      - .github/workflows/main.yml

concurrency:
  group: profile-pacman
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'vitorcgo/vitorcgo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Obter os arquivos do perfil
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Gerar Pac-Man nos temas claro e escuro
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: pacman

      - name: Verificar os arquivos gerados
        run: |
          test -s dist/pacman-contribution-graph.svg
          test -s dist/pacman-contribution-graph-dark.svg

      - name: Atualizar as animações no README
        run: |
          cp dist/pacman-contribution-graph.svg src/readme/pacman-contribution-graph.svg
          cp dist/pacman-contribution-graph-dark.svg src/readme/pacman-contribution-graph-dark.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/readme/pacman-contribution-graph.svg src/readme/pacman-contribution-graph-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: atualizar contribuições do Pac-Man"
          git pull --rebase
          git push
